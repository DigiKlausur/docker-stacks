[pytest]
# Same import setup as `python scripts/image_builder`: modules are imported flat.
# notebooks/image_info runs inside the images, but is tested here too.
pythonpath = scripts/image_builder notebooks/image_info
testpaths = scripts/image_builder/tests notebooks/image_info/tests
# Keep the cache inside the package, where its .gitignore covers it.
cache_dir = scripts/image_builder/.pytest_cache
