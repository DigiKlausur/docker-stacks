# Builds what changed on dev and pushes it to every registry with the dev tags.
# No `paths:` filter on purpose: `image_builder plan` decides what to build
# (a push with nothing relevant builds nothing).
name: Build and push dev images

on:
  push:
    branches:
      - dev

# One run per tag set at a time, so an older run can't finish last and move
# `dev` back to its images. A newer queued run replaces an older queued one.
concurrency:
  group: build-images-dev
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build_all_images.yml
    with:
      tag_set: dev
      # No fallback: if this ref is unknown (e.g. after a force push), the plan
      # fails visibly. Fix it with a manual run without `since`.
      since: ${{ github.event.before }}
      push: true
    secrets: inherit
