# Fast checks for every pull request and for pushes to dev/master.
# Two jobs, two concerns, two separate status checks.
name: Checks

on:
  pull_request:
  push:
    branches:
      - dev
      - master

permissions:
  contents: read

jobs:
  generated:
    name: Generated files up to date
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Fails if notebooks.toml changed without running
      # `python scripts/image_builder generate` (workflow or README tree stale).
      - name: Check generated files
        run: python3 scripts/image_builder generate --check

  tests:
    name: image_builder tests
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A venv, because the runner's system Python refuses `pip install`
      # (PEP 668, "externally-managed-environment").
      - name: Install pytest
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet pytest

      - name: Run tests
        run: .venv/bin/python -m pytest
