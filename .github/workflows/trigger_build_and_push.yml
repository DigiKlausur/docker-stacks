# Manually build (and optionally push) the images, e.g. to repair a run that
# failed after a force push, or to rebuild everything.
#
# There are no e2xgrader inputs (version/branch) for now: building with an
# experimental e2xgrader needs its own tag set first, so it can't overwrite
# `latest` or `dev`. Until then, try e2xgrader versions locally with
# `python scripts/image_builder build ... --build-arg E2XGRADER_VERSION=...`.
name: Manually build and push all images

on:
  workflow_dispatch:
    inputs:
      tag_set:
        description: Tag set from notebooks.toml
        type: choice
        options:
          - dev
          - master
        default: dev
      since:
        description: Only build what changed since this ref (empty = build everything)
        type: string
        default: ""
      push:
        description: Push to every registry
        type: boolean
        default: false

# Same group as the automatic runs of this tag set, so manual and automatic
# runs never move the same tags at the same time.
concurrency:
  group: build-images-${{ inputs.tag_set }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build_all_images.yml
    with:
      tag_set: ${{ inputs.tag_set }}
      since: ${{ inputs.since }}
      push: ${{ inputs.push }}
    secrets: inherit
