# Adds area labels to PRs based on the changed files (rules in .github/labeler.yml).
# Only adds labels, never removes them, so manual labels are kept.
#
# pull_request_target gives the token write access for PRs from forks too. This is
# safe here: the job never checks out or runs code from the PR, it only reads the
# list of changed files.
name: Label PRs

on:
  pull_request_target:

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
